<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Photography | Maria Bossert</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Newsreader:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="banner" style="height: clamp(8rem, 18vw, 12rem);">
    <h1 class="banner-title">Photography</h1>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <!-- Profile: to use a real photo, replace the <svg> with <img src="images/maria.jpg" alt="Maria Bossert"> -->
      <div class="profile">
        <div class="avatar">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8.5" r="4.2"/><path d="M3.5 22c0-5 3.8-8 8.5-8s8.5 3 8.5 8z"/></svg>
        </div>
        <p class="profile-name">Maria Bossert</p>
      </div>
      <nav aria-label="Main">
        <a href="index.html#about">About</a>
        <a href="index.html#research">Research portfolio</a>
        <a href="index.html#education">Education &amp; experience</a>
        <a href="index.html#awards">Awards, honors &amp; fellowships</a>
        <a href="index.html#mentorship">Mentorship &amp; teaching</a>
        <a href="index.html#links">Contact &amp; links</a>
        <span class="group">Studio</span>
        <a href="art.html">Paintings &amp; drawings</a>
        <a href="photography.html" class="active">Photography</a>
      </nav>
    </aside>

    <main class="content">
      <!-- Copy one <figure> per piece. Mix tall and wide images for a varied look. -->
      <div class="gallery">
        <figure><img src="images/photo-01.jpg" alt="Describe the image" loading="lazy"><figcaption>Title, medium, year</figcaption></figure>
        <figure><img src="images/photo-02.jpg" alt="Describe the image" loading="lazy"><figcaption>Title, medium, year</figcaption></figure>
        <figure><img src="images/photo-03.jpg" alt="Describe the image" loading="lazy"><figcaption>Title, medium, year</figcaption></figure>
        <figure><img src="images/photo-04.jpg" alt="Describe the image" loading="lazy"><figcaption>Title, medium, year</figcaption></figure>
      </div>
    </main>
  </div>

</body>
</html>
