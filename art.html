  <dialog id="lightbox">
    <img alt="">
    <p id="lightbox-caption"></p>
  </dialog>
  <script>
    // Click an artwork to enlarge it. The image glides from its spot in the
    // gallery to the big view and back. Browsers without that feature just fade.
    const box = document.getElementById('lightbox');
    const big = box.querySelector('img');
    const caption = document.getElementById('lightbox-caption');
    let current = null;

    function transition(change) {
      if (document.startViewTransition) return document.startViewTransition(change);
      change();
      return { finished: Promise.resolve() };
    }

    function openArt(link) {
      current = link.querySelector('img');
      big.src = link.href;
      big.alt = current.alt;
      caption.textContent = link.closest('figure').querySelector('figcaption').textContent;
      current.style.viewTransitionName = 'art';
      transition(() => {
        current.style.viewTransitionName = '';
        big.style.viewTransitionName = 'art';
        box.showModal();
      });
    }

    function closeArt() {
      transition(() => {
        big.style.viewTransitionName = '';
        current.style.viewTransitionName = 'art';
        box.close();
      }).finished.finally(() => { current.style.viewTransitionName = ''; });
    }

    document.querySelectorAll('.gallery a').forEach(link =>
      link.addEventListener('click', e => { e.preventDefault(); openArt(link); }));
    box.addEventListener('click', closeArt);
    box.addEventListener('cancel', e => { e.preventDefault(); closeArt(); }); // Esc key
  </script>
